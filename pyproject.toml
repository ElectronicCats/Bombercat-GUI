[project]
name = "emvycontroller"
version = "0.5.0"
description = "Suite funcional de pruebas de seguridad para tarjetas bancarias (chip EMV, NFC, banda magnética, BomberCat) con framework de PoCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "glitchboi" }]
dependencies = ["pyscard>=2.0"]

[project.optional-dependencies]
tui = ["textual>=0.60"]
gui = ["PySide6>=6.6"]
nfc = ["nfcpy>=1.0"]
msr = ["pyserial>=3.5", "evdev>=1.6"]
bombercat = ["pyserial>=3.5"]
relay = ["paho-mqtt>=1.6"]
dev = ["pytest>=7.0"]

[project.scripts]
emvyctl = "emvy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["emvyctl"]

[tool.setuptools.packages.find]
include = ["emvy*"]
