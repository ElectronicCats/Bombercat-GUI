[project]
name = "cardsec"
version = "0.5.0"
description = "Suite funcional de pruebas de seguridad para tarjetas bancarias (chip EMV, NFC, banda magnética, BomberCat) con framework de PoCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "glitchboi" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Development Status :: 4 - Beta",
]
dependencies = ["pyscard>=2.0"]

[project.optional-dependencies]
tui = ["textual>=0.60"]
gui = ["PySide6>=6.6"]
nfc = ["nfcpy>=1.0"]
msr = ["pyserial>=3.5", "evdev>=1.6"]
bombercat = ["pyserial>=3.5"]
relay = ["paho-mqtt>=1.6"]
dev = ["pytest>=7.0"]

[project.scripts]
cardsec = "cardsec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cardsecctl"]

[tool.setuptools.packages.find]
include = ["cardsec*"]
