name: Tests

on:
  push:
    paths:
      - "cardsec/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "cardsec/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# Un nuevo push a la misma rama cancela la corrida anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (pyscard)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swig libpcsclite-dev

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar el paquete
        run: |
          python -m pip install --upgrade pip
          pip install coverage
          pip install -e '.[dev,tui]'

      - name: Smoke test del CLI
        run: cardsec --help

      - name: Ejecutar la suite (offline, sin hardware)
        run: coverage run --source=cardsec -m pytest tests/ -q

      - name: Reporte de cobertura
        if: always()
        run: |
          coverage report -m
          coverage xml

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          flags: tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
